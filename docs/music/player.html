<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E1120">
<title>Bricks – musik</title>
<!-- Generated by scripts/build-music-player.mjs from src/music-player and docs/music. Do not edit by hand. -->
<style>:root{--bg:#0E1120;--panel:#151A2D;--panel-2:#1B2036;--panel-3:#262C47;--line:#2C3352;--text:#EEF1FA;--soft:#C9D0E6;--muted:#9AA3C0;--accent:#FFB547;--accent-ink:#1A1300;--ok:#4FD98A;--bad:#F2706D;--display:'Space Grotesk',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--display);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:16px}
header{display:flex;align-items:center;gap:14px;padding:6px 0 2px}
.brand{display:inline-flex;gap:4px}
.brand-tile{--tile:28px;width:var(--tile);height:var(--tile);display:grid;place-items:center;border-radius:5px;color:#10131F;font:800 16px/1 var(--display);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25)}
.brand-tile:nth-child(1){background:#5B9CF6;transform:rotate(-5deg)}.brand-tile:nth-child(2){background:#F2706D;transform:translateY(12%) rotate(3deg)}
.brand-tile:nth-child(3){background:#38D1E8;transform:translateY(3%) rotate(-2deg)}.brand-tile:nth-child(4){background:#4FD98A;transform:translateY(17%) rotate(4deg)}
.brand-tile:nth-child(5){background:#A98BF5;transform:translateY(5%) rotate(-3deg)}.brand-tile:nth-child(6){background:#F7964A;transform:translateY(10%) rotate(2deg)}
header h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.24em;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--panel-3);border-radius:20px;padding:18px}
.card h2{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;color:var(--chip,var(--accent));background:color-mix(in srgb,var(--chip,var(--accent)) 16%,transparent);white-space:nowrap}

/* Now playing */
.now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.play{width:84px;height:84px;border:0;border-radius:24px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(0,0,0,.2),0 8px 24px rgba(255,181,71,.2)}
.play:active{transform:translateY(2px)}
.play .stop-icon{display:none}.play.playing .stop-icon{display:block}.play.playing .play-icon{display:none}
.now-text{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.now-text h3{margin:0;font-size:24px;line-height:1.15}
.now-text p{margin:0;font-size:14px;color:var(--soft)}
.now-text .tempo{font-size:13px;color:var(--muted)}
.controls{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.control{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-radius:14px;background:var(--panel-2)}
.control>span{font-size:15px}
.control.unavailable{opacity:.45}
.switch{position:relative;width:52px;height:32px;border:0;border-radius:16px;background:var(--panel-3);flex:0 0 auto}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--soft);transition:transform .15s}
.switch[aria-checked=true]{background:var(--bad)}.switch[aria-checked=true]::after{transform:translateX(20px);background:#fff}
.switch:disabled{cursor:default}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border:0;border-radius:10px;background:var(--panel-3);font-size:20px}
.stepper output{width:28px;text-align:center;font-weight:700}
input[type=range]{width:min(160px,55%);accent-color:var(--accent)}
.bpm{display:flex;align-items:center;gap:10px}
.bpm strong{font-size:22px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.bpm small{color:var(--muted);font-size:12px;letter-spacing:.1em}
.beat{width:12px;height:12px;border-radius:6px;background:var(--panel-3);transition:background .08s}
.beat.on{background:var(--accent);box-shadow:0 0 12px var(--accent)}

/* Timeline */
.timeline{display:grid;grid-template-columns:auto minmax(0,1fr);border-radius:14px;background:#0A0D18;border:1px solid var(--line);overflow:hidden}
.labels{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel-2)}
.labels>div{display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.labels i{width:9px;height:9px;border-radius:5px;background:color-mix(in srgb,var(--lamp) 25%,transparent);transition:background .06s}
.labels i.on{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.scroll{position:relative;overflow-x:auto;overflow-y:hidden}
.scroll canvas{display:block}
#overlay{position:absolute;top:0;left:0;pointer-events:none}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}

/* Ranking */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank-item{display:flex;align-items:stretch;gap:6px}
.rank-select{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:var(--panel-2);text-align:left}
.rank-item.selected .rank-select{border-color:var(--accent);background:#1F2540}
.rank-num{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:#10131F;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25)}
.rank-text{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.rank-text strong{flex:1 0 100%;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-text small{font-size:12px;color:var(--muted)}
.rank-moves{display:flex;flex-direction:column;gap:4px}
.rank-moves button{flex:1;width:44px;min-height:30px;border:0;border-radius:10px;background:var(--panel-2);color:var(--soft);font-size:12px}
.rank-moves button:disabled{opacity:.3;cursor:default}
.copy-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.copy-row button{min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);font-weight:600}
.copy-row span{font-size:14px;color:var(--ok)}

@media(min-width:900px){
  main{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}
  header{grid-column:1/-1}
  .side{grid-column:2;grid-row:2/4}
}
@media(max-width:420px){
  .play{width:72px;height:72px;border-radius:20px}
  .now-text h3{font-size:20px}
}
.control[hidden]{display:none}
</style>

  </section>

<script>/*
 * Bricks music engine – shared Web Audio chiptune player for the music proposals.
 * Themes are pure data + a deterministic voices() function (see themes/*.js) and
 * register themselves with BricksMusic.register(theme).
 *
 * Theme shape:
 *   id, title, category, description
 *   tempo({ danger, loop, level }) -> BPM;  tempoLabel: string
 *   dangerMode: bool (has an intensity variant);  usesLevel: bool
 *   melody: [[note, eighths], ...] ("r" = rest);  chords: [name per bar]
 *   chordDefs: { name: { root, top, oct, triad[3] } }
 *   sections: [{ name, from, to }] in bars
 *   mix: { lead: { wave, vol, tremolo, vibrato, echo, gate }, bass: { vol }, arp: { vol, dangerVol } }
 *   leadTranspose({ danger }) -> semitones (optional)
 *   voices(step, danger, { bar, s, ch }) -> [{ kind: 'bass'|'arp', note, len } | { kind: 'kick'|'snare'|'hat' }]
 */
(function (global) {
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midi(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    if (!m) throw new Error('Bad note ' + n);
    return SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const themes = [];

  function compile(t, danger) {
    const out = [];
    for (let i = 0; i < t.length; i++) {
      const bar = Math.floor(i / 16);
      const vs = t.voices(i, danger, { bar, s: i % 16, ch: t.chordDefs[t.chords[bar]] });
      out.push(vs.map((v) => (v.note ? Object.assign({}, v, { midi: midi(v.note) }) : v)));
    }
    return out;
  }

  function register(t) {
    t.length = t.chords.length * 16;
    t.lead = new Array(t.length).fill(null);
    let s = 0;
    for (const [n, l] of t.melody) {
      if (n !== 'r') t.lead[s] = { len: l * 2, midi: midi(n) };
      s += l * 2;
    }
    t.melodySteps = s;
    if (s !== t.length) console.warn(`${t.id}: melody is ${s} steps, chords ${t.length}`);
    t.normal = compile(t, false);
    t.danger = t.dangerMode ? compile(t, true) : t.normal;
    themes.push(t);
    return t;
  }

  function createPlayer() {
    let ctx, master, echoIn, echoDelay, pulse25, pulse12, noise, timer = null;
    let theme = null, step = 0, next = 0, loop = 0, playing = false;
    let danger = false, level = 0, volume = 0.6;
    const queue = [];

    function pulseWave(d) {
      const N = 64, re = new Float32Array(N), im = new Float32Array(N);
      for (let n = 1; n < N; n++) re[n] = 4 / (n * Math.PI) * Math.sin(Math.PI * n * d);
      return ctx.createPeriodicWave(re, im);
    }

    function init() {
      if (ctx) return;
      ctx = new (global.AudioContext || global.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      master = ctx.createGain(); master.gain.value = volume;
      master.connect(comp); comp.connect(ctx.destination);
      echoIn = ctx.createGain(); echoIn.gain.value = 0.3;
      echoDelay = ctx.createDelay(2);
      const fb = ctx.createGain(); fb.gain.value = 0.35;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
      echoIn.connect(echoDelay); echoDelay.connect(lp); lp.connect(fb); fb.connect(echoDelay); lp.connect(master);
      pulse25 = pulseWave(0.25); pulse12 = pulseWave(0.125);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    function wave(o, w) {
      if (w === 'pulse25') o.setPeriodicWave(pulse25);
      else if (w === 'pulse12') o.setPeriodicWave(pulse12);
      else o.type = w;
    }

    function tone(t, dur, m, o) {
      const osc = ctx.createOscillator(); wave(osc, o.wave);
      osc.frequency.value = hz(m);
      const g = ctx.createGain(), end = t + dur * (o.gate || 0.88);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(o.vol, t + 0.004);
      g.gain.setTargetAtTime(o.vol * 0.65, t + 0.01, 0.06);
      g.gain.setTargetAtTime(0, end, 0.012);
      osc.connect(g);
      let out = g;
      if (o.tremolo) { // balalaika-style tremolo
        const tg = ctx.createGain(); tg.gain.value = 0.65;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 13;
        const la = ctx.createGain(); la.gain.value = 0.35;
        lfo.connect(la); la.connect(tg.gain); g.connect(tg); out = tg;
        lfo.start(t); lfo.stop(end + 0.1);
      }
      if (o.vibrato) { // delayed NES-style vibrato
        const lfo = ctx.createOscillator(); lfo.frequency.value = 6;
        const dg = ctx.createGain();
        dg.gain.setValueAtTime(0, t); dg.gain.linearRampToValueAtTime(18, t + Math.min(0.25, dur * 0.5));
        lfo.connect(dg); dg.connect(osc.detune);
        lfo.start(t); lfo.stop(end + 0.1);
      }
      out.connect(master);
      if (o.echo) out.connect(echoIn);
      osc.start(t); osc.stop(end + 0.1);
    }

    function drum(t, kind) {
      const s = ctx.createBufferSource(); s.buffer = noise;
      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      let vol, dec;
      if (kind === 'kick') {
        f.type = 'lowpass'; f.frequency.value = 190; vol = 0.8; dec = 0.09;
        const o = ctx.createOscillator(); o.type = 'triangle';
        o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
        const og = ctx.createGain();
        og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.13);
      } else if (kind === 'snare') { f.type = 'bandpass'; f.frequency.value = 1800; vol = 0.32; dec = 0.08; }
      else { f.type = 'highpass'; f.frequency.value = 7500; vol = 0.1; dec = 0.028; }
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dec);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t, Math.random() * 0.5); s.stop(t + dec + 0.02);
    }

    const bpmNow = () => theme.tempo({ danger: danger && theme.dangerMode, loop, level });

    function tick() {
      while (next < ctx.currentTime + 0.12) {
        const bpm = bpmNow(), sx = 60 / bpm / 4, mix = theme.mix;
        queue.push({ step, time: next, loop, bpm });
        echoDelay.delayTime.setValueAtTime(sx * 3, next);
        const ld = theme.lead[step];
        const tr = theme.leadTranspose ? theme.leadTranspose({ danger: danger && theme.dangerMode }) : 0;
        if (ld) tone(next, ld.len * sx, ld.midi + tr, {
          wave: mix.lead.wave, vol: mix.lead.vol, echo: mix.lead.echo, gate: mix.lead.gate,
          tremolo: mix.lead.tremolo && ld.len >= 8, vibrato: mix.lead.vibrato && ld.len >= 6,
        });
        const useDanger = danger && theme.dangerMode;
        for (const v of (useDanger ? theme.danger : theme.normal)[step]) {
          if (v.kind === 'bass') tone(next, v.len * sx, v.midi, { wave: 'triangle', vol: mix.bass.vol });
          else if (v.kind === 'arp') tone(next, sx, v.midi, { wave: 'pulse12', vol: useDanger ? mix.arp.dangerVol : mix.arp.vol });
          else drum(next, v.kind);
        }
        next += sx;
        if (++step >= theme.length) { step = 0; loop++; }
      }
    }

    return {
      themes,
      load(id) {
        const wasPlaying = playing;
        this.stop();
        theme = themes.find((t) => t.id === id) || themes[0];
        step = 0; loop = 0; queue.length = 0;
        if (wasPlaying) this.start();
        return theme;
      },
      start() {
        init(); ctx.resume();
        if (playing || !theme) return;
        playing = true; queue.length = 0;
        next = ctx.currentTime + 0.06;
        timer = setInterval(tick, 25);
      },
      stop() {
        playing = false; clearInterval(timer); timer = null;
        step = 0; loop = 0; queue.length = 0;
      },
      toggle() { playing ? this.stop() : this.start(); return playing; },
      setDanger(on) { danger = !!on; },
      setLevel(n) { level = Math.max(0, n | 0); },
      setVolume(v) { volume = v; if (master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.02); },
      /** What is audible right now: { step, loop, bpm } or null. */
      now() {
        if (!playing || !ctx) return null;
        let cur = null;
        while (queue.length && queue[0].time <= ctx.currentTime) cur = queue.shift();
        if (cur) { queue.unshift(cur); }
        return cur;
      },
      get theme() { return theme; },
      get playing() { return playing; },
      get danger() { return danger; },
      get bpm() { return theme ? Math.round(bpmNow()) : 0; },
    };
  }

  global.BricksMusic = { register, createPlayer, themes, midi };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  id: 'nightshift',
  title: 'Night Shift',
  category: 'Mörk groove',

  tempo: () => 120,
  dangerMode: true,
  usesLevel: false,
  melody: [
    ['D5',1],['r',1],['F5',1],['A5',1],['r',1],['G5',1],['F5',1],['E5',1],

    ['F5',2],['E5',1],['D5',1],['A4',4],
    ['Bb4',1],['D5',1],['F5',1],['Bb5',1],['A5',1],['F5',1],['D5',2],
    ['C5',1],['E5',1],['G5',1],['C6',1],['Bb5',1],['G5',1],['E5',2],
    ['A5',2],['G5',1],['F5',1],['E5',2],['C#5',2],

  chords: ['Dm','Dm','Bb','C','Dm','Dm','Bb','A','F','C','G','Dm','Bb','C','A','A'],
  chordDefs: {

    Bb: { root: 'Bb1', top: 'F2', oct: 'Bb2', triad: ['Bb4','D5','F5'] },
    C:  { root: 'C2', top: 'G2', oct: 'C3', triad: ['C5','E5','G5'] },
    A:  { root: 'A1', top: 'E2', oct: 'A2', triad: ['A4','C#5','E5'] },
    F:  { root: 'F2', top: 'C3', oct: 'F3', triad: ['F4','A4','C5'] },

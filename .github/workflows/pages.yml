name: Deploy Bricks to GitHub Pages

on:
  push:
    branches: [main, milestone-3.3, milestone-3.4, milestone-3.5, milestone-3.6, milestone-3.7, milestone-3.9, milestone-3.11, milestone-3.12, feature/operating-controls, feature/visual-refresh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Firebase emulator checks
        run: |
          set +e
          npm run test:firebase > firebase-tests.log 2>&1
          result=$?
          cat firebase-tests.log
          echo '### Firebase emulator checks' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 firebase-tests.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import pathlib, re
          raw = re.sub(r'\x1b\[[0-9;]*m', '', pathlib.Path('firebase-tests.log').read_text())
          lines = [line[:350] for line in raw.splitlines() if re.search(r'(^✖|^not ok|failureType:|location:|error:|Error:|stack:)', line)]
          text = '\n'.join(lines[-40:]) or raw[-3500:]
          print('::error title=Firebase test details::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$result"
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_OPERATING_ORIGIN: ${{ vars.VITE_OPERATING_ORIGIN }}
      - run: npm run test:browser
      - run: npm run test:operating
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-operating-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/operating-controls' && contains(github.event.head_commit.message, '[deploy operating]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: operating-artifact
      - name: Restore checked game assets
        run: |
          mkdir -p dist
          tar -xf operating-artifact/artifact.tar -C dist
          test -f dist/index.html
      - name: Publish operating preview
        run: npx wrangler deploy --config wrangler.operating.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ba62b17cf838a334c50450438732f225
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify live operating preview
        run: node scripts/check-operating-preview.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
